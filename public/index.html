<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PravahaX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="auth-screen" class="screen active">
    <div class="login-box">
      <h1>PravahaX</h1>
      <p>Enterprise Chat & Call</p>
      <div id="auth-tabs">
        <button class="tab-btn active" data-tab="login">Login</button>
        <button class="tab-btn" data-tab="register">Register</button>
      </div>
      <form id="login-form">
        <input type="text" id="login-username" placeholder="Username" required />
        <input type="password" id="login-password" placeholder="Password" required />
        <button type="submit">Login</button>
      </form>
      <form id="register-form" class="hidden">
        <input type="text" id="reg-username" placeholder="Username (3-20 chars)" required />
        <input type="email" id="reg-email" placeholder="Email (optional)" />
        <input type="password" id="reg-password" placeholder="Password (min 6 chars)" required />
        <button type="submit">Register</button>
      </form>
      <p id="auth-error" class="error"></p>
    </div>
  </div>

  <div id="app-screen" class="screen">
    <aside id="sidebar">
      <div id="sidebar-header">
        <h2>Online</h2>
        <span id="online-count">0</span>
      </div>
      <ul id="user-list"></ul>
      <div id="sidebar-footer">
        <span id="current-user"></span>
        <button id="logout-btn" title="Logout">Logout</button>
      </div>
    </aside>
    <main id="main">
      <div id="chat-view">
        <div id="messages"></div>
        <div id="chat-input-area">
          <input type="text" id="msg-input" placeholder="Type a message..." />
          <button id="send-btn">Send</button>
        </div>
      </div>
      <div id="call-view" class="hidden">
        <div id="call-info">
          <h3 id="call-status">Calling...</h3>
          <p id="call-peer-name"></p>
        </div>
        <div id="video-container">
          <video id="remote-video" autoplay playsinline></video>
          <video id="local-video" autoplay playsinline muted></video>
        </div>
        <div id="call-controls">
          <button id="toggle-mic" class="ctrl-btn">Mute</button>
          <button id="toggle-cam" class="ctrl-btn">Cam Off</button>
          <button id="end-call" class="ctrl-btn end">End Call</button>
        </div>
      </div>
    </main>
  </div>

  <div id="incoming-call" class="modal hidden">
    <div class="modal-box">
      <p id="caller-name"></p>
      <h3>Incoming Call</h3>
      <div class="modal-actions">
        <button id="accept-call" class="accept">Accept</button>
        <button id="reject-call" class="reject">Reject</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
